# Influencer-Automation 2.0 configuration example.
# The app copies this file to config.toml on first run. Keep API keys and other
# credentials in config.toml; do not commit your local config.toml.

# =============================================================================
# API Service / API 服务
# =============================================================================
# Log level: DEBUG, INFO, WARNING, or ERROR.
log_level = "DEBUG"
# Use 127.0.0.1 for local-only access. 0.0.0.0 listens on all network interfaces.
listen_host = "0.0.0.0"
listen_port = 8080

[app]

# -----------------------------------------------------------------------------
# General / 通用设置
# -----------------------------------------------------------------------------

# Hide the basic configuration panel in the WebUI.
# 是否隐藏 WebUI 基础配置面板。
hide_config = false

# Timeout in seconds for a single Edge TTS streaming request.
# 单次 Edge TTS 流式请求超时时间。慢网络可适当调大，设置为 0 表示禁用超时。
edge_tts_timeout = 30

# Verify TLS certificates for external APIs and material downloads.
# 默认应保持开启；仅在可信代理或自签名证书环境中临时关闭。
tls_verify = true

# -----------------------------------------------------------------------------
# Video Materials / 视频素材
# -----------------------------------------------------------------------------

# Available values: "pexels", "pixabay", "coverr", "storyblocks", "local".
video_source = "pexels"

# API key lists support key rotation. Use straight ASCII double quotes and
# separate multiple keys with commas, for example: ["key-1", "key-2"].
# Key 必须使用英文半角双引号，多个 Key 使用英文逗号分隔。

# Register at https://www.pexels.com/api/
pexels_api_keys = []

# Register at https://pixabay.com/api/docs/
pixabay_api_keys = []

# Register at https://coverr.co/developers?ctx=header_navigation
coverr_api_keys = []

# Storyblocks API v2 uses a public key + private HMAC key pair and requires a
# project/user id for search and download requests. Keep empty unless you have
# an active API agreement. The connector searches vertical, safe, non-editorial
# footage and can optionally require explicit talent/property releases.
storyblocks_public_key = ""
storyblocks_private_key = ""
storyblocks_project_id = ""
storyblocks_user_id = ""
storyblocks_quality = "HD"
storyblocks_download_quality = "_1080p"
storyblocks_results_per_page = 8
storyblocks_max_duration = 30
storyblocks_required_keywords = ""
storyblocks_filtered_keywords = "text,logo,watermark,news,editorial"
storyblocks_require_talent_release = false
storyblocks_require_property_release = false

# Optional TwelveLabs integration for semantic material ranking and video QA.
# Install the optional dependency with: uv sync --extra twelvelabs
# Create an API key at https://playground.twelvelabs.io/
twelvelabs_api_keys = []
# Reorder search terms using Marengo before downloading materials. This option
# is ignored when match_materials_to_script is enabled.
twelvelabs_rerank_terms = false
# Optional model overrides. Uncomment only when a different model is required.
# twelvelabs_marengo_model = "marengo3.0"
# twelvelabs_pegasus_model = "pegasus1.5"

# Match search terms and downloaded materials to the script narrative order.
# 默认关闭，开启后会减少随机性，使素材顺序更贴近文案结构。
match_materials_to_script = false

# Optional Sonilo video-matched original background music.
# Create a key at https://platform.sonilo.com/dashboard. The WebUI can also save
# this value, or you can set the SONILO_API_KEY environment variable instead.
sonilo_api_key = ""
sonilo_base_url = "https://api.sonilo.com"
# 单次生成流连续无数据时的最长等待秒数；它不是整个请求的总耗时上限。
sonilo_timeout = 600

# -----------------------------------------------------------------------------
# LLM Providers / 大模型提供商
# -----------------------------------------------------------------------------

# Provider definitions, default models, and default Base URLs are maintained in
# app/models/llm_provider.py. Leave model_name and base_url empty to follow the
# Registry defaults; only set them when you need an explicit override.
llm_provider = "openai"

# Kimi / Moonshot AI
# API key: https://platform.kimi.com/console/api-keys
moonshot_api_key = ""
moonshot_base_url = ""
moonshot_model_name = ""

# OpenAI or another OpenAI Chat Completions-compatible provider.
# API key: https://platform.openai.com/api-keys
openai_api_key = ""
openai_base_url = ""
openai_model_name = ""

# Google Gemini
# API key: https://aistudio.google.com/app/apikey
gemini_api_key = ""
gemini_model_name = ""

# DeepSeek
# API key: https://platform.deepseek.com/api_keys
deepseek_api_key = ""
deepseek_base_url = ""
deepseek_model_name = ""

# Alibaba Cloud Qwen
# API key: https://dashscope.console.aliyun.com/apiKey
qwen_api_key = ""
qwen_model_name = ""

# Microsoft Azure OpenAI. model_name is the deployment name.
# Documentation: https://learn.microsoft.com/azure/ai-services/openai/reference
azure_api_key = ""
azure_base_url = ""
azure_model_name = ""
azure_api_version = "2024-02-15-preview"

# ByteDance VolcEngine Ark
# Console: https://console.volcengine.com/ark
volcengine_api_key = ""
volcengine_base_url = ""
volcengine_model_name = ""

# xAI Grok
# API key: https://console.x.ai/
grok_api_key = ""
grok_base_url = ""
grok_model_name = ""

# MiniMax. The API key and Base URL must use the same platform.
# China: https://platform.minimaxi.com/ | https://api.minimaxi.com/v1
# International: https://platform.minimax.io/ | https://api.minimax.io/v1
minimax_api_key = ""
minimax_base_url = ""
minimax_model_name = ""

# Xiaomi MiMo
# Documentation: https://platform.xiaomimimo.com/docs/zh-CN/quick-start/first-api-call
mimo_api_key = ""
mimo_base_url = ""
mimo_model_name = ""

# Cloudflare AI Gateway. The token requires AI Gateway Read/Edit and Workers AI
# Read permissions. Leave gateway_id empty to use the Registry default.
# Dashboard: https://dash.cloudflare.com/
cloudflare_api_key = ""
cloudflare_account_id = ""
cloudflare_gateway_id = ""
cloudflare_model_name = ""

# Alibaba ModelScope. Bind an Alibaba Cloud account before using API inference.
# Documentation: https://modelscope.cn/docs/model-service/API-Inference/intro
modelscope_api_key = ""
modelscope_base_url = ""
modelscope_model_name = ""

# AIHubMix, an OpenAI-compatible multi-model gateway.
# API key: https://aihubmix.com/
aihubmix_api_key = ""
aihubmix_base_url = ""
aihubmix_model_name = ""

# AIML API, an OpenAI-compatible multi-model API.
# API key: https://aimlapi.com/app/keys
aimlapi_api_key = ""
aimlapi_base_url = ""
aimlapi_model_name = ""

# EvoLink, an OpenAI-compatible multi-model gateway.
# API key: https://evolink.ai/dashboard/keys
evolink_api_key = ""
evolink_base_url = ""
evolink_model_name = ""

# Ollama. Leave base_url empty to use the environment-aware local default.
# Set model_name to a model installed by `ollama pull` or shown by `ollama list`.
ollama_base_url = ""
ollama_model_name = ""

# OneAPI. Use the token, Base URL, and model ID from your OneAPI deployment.
# Project: https://github.com/songquanpeng/one-api
oneapi_api_key = ""
oneapi_base_url = ""
oneapi_model_name = ""

# LiteLLM uses provider credentials from environment variables, such as
# OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, or AWS_ACCESS_KEY_ID.
# Model formats: openai/gpt-4o, anthropic/claude-sonnet-4, ollama/llama3.
# Providers: https://docs.litellm.ai/docs/providers
litellm_model_name = ""

# Groq
# API key: https://console.groq.com/keys
groq_api_key = ""
groq_base_url = ""
groq_model_name = ""

# Pollinations AI: https://enter.pollinations.ai/
pollinations_api_key = ""
pollinations_base_url = ""
pollinations_model_name = ""

# -----------------------------------------------------------------------------
# Speech, Subtitles, and Video / 语音、字幕与视频
# -----------------------------------------------------------------------------

# Xiaomi MiMo TTS shares mimo_api_key and mimo_base_url with the MiMo LLM.
mimo_tts_model_name = "mimo-v2.5-tts"
mimo_tts_style_prompt = "请用自然、清晰、适合短视频旁白的语气朗读。"

# Subtitle provider: "edge" or "whisper". Whisper is loaded only when selected
# explicitly; Edge failures do not trigger an automatic Whisper model download.
# Leave empty to skip generation.
subtitle_provider = "edge"

# FFmpeg is normally downloaded and detected automatically. If detection fails,
# download it from https://www.gyan.dev/ffmpeg/builds/ and set the executable.
# Windows example: ffmpeg_path = "C:\\path\\to\\ffmpeg.exe"
# ffmpeg_path = ""

# Leave unset to follow the app default (libx264). Hardware encoders are optional;
# unsupported encoders automatically fall back to libx264.
# Available values: "libx264", "h264_nvenc", "h264_amf", "h264_qsv",
# "h264_mf", "h264_videotoolbox".
# video_codec = "libx264"

# Local encode quality profile. "balanced" improves default x264 quality without
# the file-size cost of the high profile. Use "draft" for previews and "high"
# when upload quality matters more than local encode time/disk use.
# Available values: "draft", "balanced", "high".
# video_quality = "balanced"
# Optional advanced overrides. video_crf only applies to libx264; lower is
# higher quality/larger files. video_bitrate is mainly useful for hardware
# encoders whose CRF/CQ flags differ by vendor.
# video_crf = 20
# video_encode_preset = "medium"
# video_bitrate = "8000k"

# How mismatched source aspect ratios are fit into the final frame.
# "letterbox" preserves the full source with black bars. "crop" fills the frame
# and avoids bars, but may crop edges.
# video_fill_mode = "letterbox"

# -----------------------------------------------------------------------------
# Storage and Task Runtime / 存储与任务运行
# -----------------------------------------------------------------------------

# Public base URL used to build generated video download links. Leave empty to
# use the current API service address, or set an external reverse-proxy URL.
endpoint = ""

# Material storage: "" uses ./storage/cache_videos, "task" stores materials in
# each task directory, and an absolute path stores materials in that directory.
# Example: material_directory = "/path/to/videos"
material_directory = ""

# Random online material downloads can run concurrently. Keep this small to
# avoid unnecessary bandwidth pressure or provider throttling; ordered/script
# matching mode remains serial to preserve timeline intent.
material_download_concurrency = 2

# Number of final outputs rendered in parallel when video_count > 1. Keep this
# small because each output can run FFmpeg with n_threads.
video_output_parallelism = 2

# Optional Redis-backed task state. Keep Redis private to this application;
# untrusted writers must not be able to modify serialized task records.
enable_redis = false
redis_host = "localhost"
redis_port = 6379
redis_db = 0
redis_password = ""

# Maximum number of concurrent and queued API video-generation tasks.
max_concurrent_tasks = 5
max_queued_tasks = 100

# -----------------------------------------------------------------------------
# Cross-platform Publishing / 跨平台发布
# -----------------------------------------------------------------------------

# Upload-Post can publish generated videos to TikTok, Instagram, and YouTube.
# Create an account and API key at https://upload-post.com/
# API documentation: https://docs.upload-post.com/
upload_post_enabled = false
upload_post_api_key = ""
upload_post_username = ""
# Available values: "tiktok", "instagram", "youtube".
upload_post_platforms = ["tiktok", "instagram"]
# Automatically publish successful video outputs after generation.
upload_post_auto_upload = false
# YouTube privacy: "public", "unlisted", or "private".
upload_post_youtube_privacy_status = "public"
# Maximum number of running and queued cross-post jobs per process. When the
# limit is reached, video generation still succeeds and only cross-posting is
# rejected.
# Cross-post jobs run in the current process and are not resumed after restart.
upload_post_max_pending_tasks = 10

# Postiz can schedule generated Article Mode videos to Instagram through the
# self-hosted public API. Keep disabled until the API URL, key and exact
# Instagram integration id have been verified with `GET /integrations`.
# First approved evergreen lane: Bible tips for everyday growth. Suggested
# account promise: "One Bible-based tip to grow in your day-to-day life."
postiz_enabled = false
postiz_base_url = "https://postiz.thestarrynight.dev/public/v1"
postiz_api_key = ""
postiz_integration_id = ""
# "instagram" for FB-linked Instagram, or "instagram-standalone".
postiz_provider_type = "instagram"
postiz_auto_schedule_enabled = false
# Account-local itinerary. Postiz selects the next legal slot per type; the
# scheduler decides which type is due. These defaults interleave a morning feed
# post, daytime carousel, evening Reel, and three story windows.
content_timezone = "America/Mexico_City"
content_utc_offset_hours = -6
postiz_daily_quota_post = 1
postiz_daily_quota_carousel = 1
postiz_daily_quota_reel = 1
postiz_daily_quota_story = 3
postiz_window_post = "06:30-07:45"
postiz_window_carousel = "12:00-13:30"
postiz_window_reel = "20:00-21:30"
postiz_window_story = "08:15-09:00,14:00-15:00,21:45-22:30"
content_scheduler_schedule_days_ahead = 1
content_scheduler_carousel_attempts = 6
# Comma-separated reliable Wikimedia subjects for the automated carousel lane.
# Keeping the scheduler on broad landscape/nature searches avoids sparse
# wildlife queries blocking the whole itinerary.
content_scheduler_carousel_subjects = "mountains,auroras,sunsets,oceans,forests,deserts,rivers,storms,glaciers,night_sky,waterfalls,canyons,volcanoes,lakes,islands,clouds,wildflowers"
# Fallback spacing used only for content types without a configured window.
postiz_schedule_interval_hours = 2
postiz_schedule_jitter_minutes = 30
postiz_daily_post_cap = 8
# Instagram setting sent as settings.post_type. Keep "post" for reels/feed.
postiz_post_type = "post"

# Quiet quote Reel mode renders one cinematic vertical clip with a centered
# saveable quote and strips source audio from raw clips. Keep scheduling disabled
# until the configured media directory contains raw, text-free footage.
quote_reel_auto_schedule_enabled = false
quote_reel_media_dir = ""
# curated | comfyui | storyblocks | pexels | pixabay | coverr | stock | auto
# "comfyui" generates the backdrop on the local GPU instead of searching stock —
# the same move Article Mode made, and the closest match to the reference Reels.
# "auto" tries curated, then comfyui, then storyblocks, then stock.
quote_reel_media_source = "curated"
quote_reel_stock_provider = "pexels" # used when quote_reel_media_source = "stock" or auto falls through
quote_reel_target_seconds = 15
# Drives the quote, the caption call-to-action, the fallback lines and the
# default hashtags together. "English" or "Spanish"; anything else falls back to
# English. Do not set this alone expecting the caption to follow — it does now,
# but the hashtag SET (postiz hashtag rotation) is configured separately.
quote_reel_default_language = "English"
quote_reel_caption_hashtags = []
quote_reel_hashtag_set = ""
quote_reel_search_terms = []
quote_reel_assume_curated_text_free = true
quote_reel_assume_stock_text_free = true
quote_reel_skip_stock_review_risk = true
quote_reel_min_visual_contrast = 12
quote_reel_storyblocks_clip_seconds = 6
quote_reel_stock_clip_seconds = 6

# Legibility. White serif needs a dark-ish backdrop; stock footage often is not.
# The renderer washes the text band down toward _target_luma, up to _scrim_max
# (0 = never darken). QC flags the reel for review when the band is still above
# _max_text_band_luma after that wash.
quote_reel_scrim_target_luma = 110
quote_reel_scrim_max = 0.55
quote_reel_max_text_band_luma = 150

# A silent Reel gets scrolled past. Raw clip audio is always stripped; this mixes
# a licensed bed underneath instead.
#
# The bed comes from the generated music pool (app/services/brand_music.py), NOT
# from resource/songs/ — those 29 tracks ship with no licence file and Instagram
# fingerprints audio, so an unlicensed bed risks a Reel being muted or region
# blocked long after it published. Set quote_reel_music_file to override the
# pool with one specific file of your own.
quote_reel_music_enabled = true
quote_reel_music_file = ""
quote_reel_music_volume = 0.22

# The licensed music pool. Beds are generated ahead of time through the
# account's own ElevenLabs subscription, the same shape as the motion clip pool:
# a paid API call and a multi-minute wait have no business inside the publish
# path, where a timeout costs the post.
#
# Fill it with:  ./run-music-pool.sh --top-up
#
# The target is capped at (number of prompts x variants), so raising it beyond
# that reports a shortfall the pool can never clear. Prompts default to six
# instrumental beds in brand_music.PROMPTS and are overridable per account via
# the pack's music.prompts.
music_pool_target = 12
music_pool_variants_per_prompt = 2

# THE FALLBACK IS SILENCE. With an empty pool a Reel renders without a bed;
# it does not reach for resource/songs/. Set this true only to knowingly accept
# the licensing risk described above.
music_allow_bundled_songs = false

# Release checks, off by default. Stock metadata never carries an explicit talent
# release, so turning these on flags every clip containing a person.
quote_reel_require_talent_release = false
quote_reel_require_property_release = false

# -----------------------------------------------------------------------------
# Article Mode / 文章模式 (automation-first news-to-video)
# -----------------------------------------------------------------------------
# Article Mode polls RSS/Atom feeds or single article URLs, uses the configured
# LLM to score and summarize stories, generates a source-grounded short-form
# script, selects licensed stock visuals, and renders a video. It does NOT
# guarantee truth and is not professional fact-checking. Videos are labelled
# "Generated from available sources." Read docs/article-mode-en.md first.

# SQLite database for subscriptions, articles, clusters and scores. Empty uses
# storage/article/articles.db. The polling worker and API share this file.
article_database_path = ""

# Fetch limits for untrusted article/feed content (SSRF-protected, size-capped).
article_request_timeout = 20
article_max_bytes = 5242880        # 5 MB response cap per fetch
article_max_text_length = 40000    # max extracted characters kept per article
article_reference_cache_ttl = 900  # seconds to reuse a fetched article (0 disables)
# Optional cheaper/faster model for lightweight JSON side tasks (article brief,
# fact-check). Empty = use the main llm model_name. Same provider/key/base_url.
article_brief_model_name = ""

# Default ingestion behaviour (per-subscription values override these).
article_default_freshness_hours = 72
article_poll_interval_minutes = 60
# Corroboration is a soft preference, not a hard gate (see thresholds below).
article_default_min_independent_sources = 1
article_trusted_domains = []       # e.g. ["reuters.com", "apnews.com"]
article_blocked_domains = []

# Image provider for images-only / mixed media. "pexels" or "pixabay"; reuses
# the pexels_api_keys / pixabay_api_keys configured above.
article_image_provider = "pexels"
# Voice used by unattended Article Mode worker renders. Set this to an Edge,
# Azure, Gemini, SiliconFlow, Mimo, ElevenLabs or Chatterbox voice for narrated
# production videos. The no-voice fallback creates local timed silent audio and
# is useful for offline validation.
article_voice_name = "no-voice"
# Default media mode for article videos: "images_only", "videos_only", "mixed".
article_media_mode = "images_only"
# Add a small on-screen "illustrative visuals" flag for generic contextual media.
article_add_illustrative_label = true

# --- Automation thresholds (all scores compared on a 0..1 scale) -------------
# Mode: "assisted" (stop before render), "automated" (render, stop before
# publish), or "autonomous" (render + publish).
article_automation_mode = "assisted"
article_minimum_story_score = 0.6
article_minimum_confidence_score = 0.6
article_minimum_visual_score = 0.4
article_auto_generate_enabled = true
article_auto_render_enabled = false
article_auto_publish_enabled = false        # keep disabled by default
article_auto_rewrite_attempts = 1
article_allow_single_source_stories = true
article_allow_unverified_developing_stories = true
# Max AI-assessed risk that may still auto-publish: "low", "medium", "high".
article_maximum_risk_for_auto_publish = "low"
# Daily safety caps for the worker.
article_max_generations_per_day = 20
article_max_publications_per_day = 10

# --- Sensitive topics --------------------------------------------------------
# Sensitive stories may still be generated, but by default require human
# approval before publishing and keep uncertainty language. Set to false to let
# autonomous mode publish them (not recommended).
article_require_review_for_sensitive_topics = true
# Categories the reviewer should treat with extra care.
article_sensitive_categories = [
    "politics", "health", "finance", "legal", "crime", "war",
    "emergency", "disaster", "death",
]

# =============================================================================
# Whisper Subtitles / Whisper 字幕
# =============================================================================

[whisper]
# The model is downloaded automatically on first use unless a matching local
# directory exists at ./models/whisper-{model_size}.
model_size = "large-v3"
# device: "cpu" or "cuda". Common compute types include "int8" for CPU and
# "float16" or "int8_float16" for CUDA.
device = "cpu"
compute_type = "int8"

# =============================================================================
# Material Request Proxy / 素材请求代理
# =============================================================================

[proxy]
# Optional proxy used by Pexels, Pixabay, Coverr, and material downloads.
# Format: "http://<username>:<password>@<proxy>:<port>"
# Documentation: https://requests.readthedocs.io/en/latest/user/advanced/#proxies
# http = "http://127.0.0.1:3128"
# https = "http://127.0.0.1:1080"

# =============================================================================
# TTS Providers / 语音合成服务
# =============================================================================

[azure]
# Azure Speech TTS credentials. These are separate from Azure OpenAI settings.
# API key: https://portal.azure.com/#view/Microsoft_Azure_ProjectOxford/CognitiveServicesHub/~/SpeechServices
speech_key = ""
speech_region = ""

[siliconflow]
# SiliconFlow TTS API key: https://siliconflow.cn/
api_key = ""

[elevenlabs]
# API key: https://elevenlabs.io/app/settings/api-keys
# Favorite voices in the ElevenLabs voice library are shown in the WebUI.
api_key = ""
# Available models include eleven_multilingual_v2, eleven_flash_v2_5, and eleven_v3.
model_id = "eleven_multilingual_v2"
# Video-to-Music uses a separate model family while sharing the same API key.
music_model_id = "music_v2"
music_timeout = 600

[chatterbox]
# OpenAI-compatible Chatterbox TTS server. The defaults target
# travisvn/chatterbox-tts-api running locally on port 4123.
base_url = "http://127.0.0.1:4123/v1"
api_key = ""
model_id = "chatterbox"
# Voice names exposed by the configured Chatterbox server.
voices = ["default-Female"]

# =============================================================================
# WebUI Preferences / WebUI 偏好
# =============================================================================

[ui]
# Hide generation logs in the WebUI.
hide_log = false

# The WebUI writes the remaining preferences automatically. Uncomment values
# below only when you want to define initial defaults manually.
# language = "zh"
# tts_server = "azure-tts-v1"
# voice_name = ""
# font_name = "MicrosoftYaHeiBold.ttc"
# font_size = 60
# text_fore_color = "#FFFFFF"
# subtitle_position = "bottom" # "top", "center", "bottom", or "custom"
# custom_position = 70.0       # Percentage from the top when using "custom"
# subtitle_background_enabled = false
# subtitle_background_color = "#000000"
# rounded_subtitle_background = false
