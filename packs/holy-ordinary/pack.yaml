# holy-ordinary — the pack for @faith.intheordinary.
#
# GENERATED from the module constants when packs were introduced, so the
# first pack is provably identical to the behaviour that was already
# shipping. Edit freely from here; see app/services/pack.py for what does
# and does not belong in a pack (safety gates stay in code).
#
# Every key is OPTIONAL. Delete one and the module default applies.

meta:
  name: holy-ordinary
  account: faith.intheordinary
  description: Devotional scripture cards, nature carousels and quiet quote Reels. Muted, unpeopled, public-domain
    scripture.
  language: English
brand:
  wordmark: holy ordinary
  tagline:
  - creation
  - × wonder
verse_card:
  background_subjects:
  - soft morning mist over a quiet meadow at sunrise
  - golden hour light through tall forest pines
  - calm lake at dawn with gentle reflections
  - rolling hills under a wide pastel sky
  - sunlight breaking through low clouds over open fields
  - gentle ocean waves on an empty shore at first light
  - dew on wild grass in early morning light
  - quiet mountain range under soft blue haze
  - wheat field swaying in warm evening light
  - still river winding through autumn woodland
  - desert dunes under a soft dawn sky
  - snowfall over silent evergreen trees
  - rain on a window with soft daylight behind
  - a narrow country path between hedgerows at dusk
  - olive trees on a hillside in warm afternoon light
  - low tide on a wide empty beach under pale sky
  - morning fog rolling through a shallow valley
  - wildflowers in a field under an overcast sky
  - sunlight through cathedral of tall birch trees
  - a calm harbour at first light, no boats moving
  - frost on bare branches in blue morning light
  - clouds building over a wide open plain
  - a mountain stream over smooth stones
  - tall grass bending in coastal wind
  - an empty wooden bench beside still water
  - warm lamplight through a rain-streaked window
  - sun setting behind distant rolling hills
  - a quiet forest floor covered in fallen leaves
  - moonlight over a calm sea
  - first snow settling on a quiet field
  style_suffix: photographic, natural light, shallow depth of field, muted warm tones, cinematic, serene,
    minimal composition, negative space, 35mm, high detail
  negative_prompt: people, person, human, face, portrait, jesus, christ, saint, angel, figure, crowd,
    hands, text, watermark, signature, logo, letters, words, caption, cross, crucifix, church interior,
    statue, lowres, blurry, jpeg artifacts, oversaturated, hdr, deformed, cartoon, 3d render
carousel:
  cover_variants:
  - THE CREATIVITY OF GOD IN {noun}
  - '{count} PLACES THAT LOOK PAINTED'
  - DID GOD OVERDO IT WITH {noun}?
  - '{noun}, AND NOTHING WE MADE'
  - '{count} THINGS NOBODY DESIGNED'
  - YOU HAVE NEVER SEEN {noun} LIKE THIS
  place_only_variants:
  - 1
  questions:
  - Which one would you stand in?
  - Which slide made you stop?
  - Save this for the day you need it — which one?
  - Where would you take this in?
  - Tag someone who needs to see slide 3.
  caption_leads:
  - The creativity of God in {noun}
  - '{noun}, and what they say about the One who made them'
  - A closer look at {noun}
  - Photographs of {noun}, and a reason to slow down
  - What {noun} are still doing without an audience
  caption_bodies:
  - Creation keeps saying something we did not invent. Swipe through and let it slow you down for a minute.
  - None of this was made to be photographed. It was here first, and it will be here after the scroll.
  - Swipe slowly. There is no hurry in any of these.
  - Every one of these is a real place, photographed by someone who went there.
  - Worth looking at for longer than an algorithm expects you to.
  save_asks:
  - Save this set for a day that needs slowing down.
  - Save it — and send it to whoever would stand there with you.
  - Keep this one. Share it if it is not just for you.
  cta_lines:
  - keep this one
  - for a slower morning
  cta_micro: SAVE  ·  SHARE  ·  FOLLOW
