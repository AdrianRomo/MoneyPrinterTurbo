x-common-volumes: &common-volumes
  - ./:/influencer-automation-2.0

services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "influencer-automation-2.0-webui"
    ports:
      - "${WEBUI_HOST_BIND:-127.0.0.1}:${WEBUI_PORT:-8501}:8501"
    command: [ "streamlit", "run", "./webui/Main.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.serverAddress=127.0.0.1", "--server.enableCORS=True", "--browser.gatherUsageStats=False", "--client.toolbarMode=minimal", "--logger.hideWelcomeMessage=True", "--server.showEmailPrompt=False" ]
    volumes: *common-volumes
    restart: always
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "influencer-automation-2.0-api"
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    command: [ "python3", "main.py" ]
    volumes: *common-volumes
    restart: always
# NOTE: there is deliberately no content-scheduler service here.
#
# On the AI workstation the scheduler is mpt-content-scheduler.timer, which runs
# `docker exec influencer-automation-2.0-api python3 -m app.services.content_scheduler`.
# A second scheduler defined here reuses the compose project name but NOT the
# stack's storage bind mount, so it gets its own storage/postiz/publish_log.json.
# Two ledgers means neither can see the other's posts and the daily quota stops
# holding — on 2026-08-16 that queued the same Reel to Instagram twice.
# Run the loop by hand if you need it (`--loop --interval N`), but do not give it
# its own container unless it mounts the same storage path as api/worker.
